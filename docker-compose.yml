services:
  sim:
    build:
      context: .
      dockerfile: Dockerfile
    image: armweb:latest
    container_name: armweb_sim
    hostname: armweb-sim
    restart: unless-stopped
    shm_size: '1gb'
    environment:
      ROS_DOMAIN_ID: '${ROS_DOMAIN_ID:-0}'
      RMW_IMPLEMENTATION: '${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}'
      RCUTILS_LOGGING_BUFFERED_STREAM: '0'
      # No GPU in this environment: force CPU software rasterisation.
      LIBGL_ALWAYS_SOFTWARE: '1'
      GALLIUM_DRIVER: 'llvmpipe'
      PYTHONUNBUFFERED: '1'
    volumes:
      # The workspace is bind-mounted read-write, but ./data is a SEPARATE
      # mount. Keeping them apart means the container never has to recreate
      # ./data, so the mount stays valid across host-side edits.
      - ./ws:/ws
      - ./data:/ws/data
    ports:
      # Foxglove WebSocket bridge -> https://app.foxglove.dev
      - '${FOXGLOVE_PORT:-8765}:8765'
    command: ["/ws/scripts/entrypoint.sh"]
    healthcheck:
      test: ['CMD', '/ws/scripts/healthcheck.sh']
      interval: 20s
      timeout: 15s
      retries: 5
      start_period: 60s